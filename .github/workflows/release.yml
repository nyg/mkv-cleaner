name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Exact version to release (overrides bump, e.g. 2.0.0)
        type: string
        default: ""
      dry_run:
        description: Compute and validate everything, push nothing
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse to release from a branch other than master
        run: |
          test "$GITHUB_REF" = refs/heads/master || {
            echo "ERROR: release runs on master only, got $GITHUB_REF" >&2
            exit 1
          }

      - name: Repo checks pass
        run: |
          ./scripts/sync-agents-md.sh --check
          for f in install.sh mkv-clean.sh scripts/sync-agents-md.sh; do sh -n "$f"; done

      - name: Compute the new version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT: ${{ inputs.version }}
        run: |
          set -eu
          MANIFESTS=".claude-plugin/plugin.json .codex-plugin/plugin.json .github/plugin/plugin.json"
          CURRENT=$(jq -r .version .claude-plugin/plugin.json)
          for f in $MANIFESTS; do
            v=$(jq -r .version "$f")
            test "$v" = "$CURRENT" || {
              echo "ERROR: $f is at $v, .claude-plugin/plugin.json is at $CURRENT" >&2
              exit 1
            }
          done

          if [ -n "$EXPLICIT" ]; then
            NEXT="$EXPLICIT"
          else
            NEXT=$(echo "$CURRENT" | awk -F. -v part="$BUMP" '
              { major = $1; minor = $2; patch = $3 }
              part == "major" { major++; minor = 0; patch = 0 }
              part == "minor" { minor++; patch = 0 }
              part == "patch" { patch++ }
              { printf "%d.%d.%d", major, minor, patch }')
          fi

          echo "$NEXT" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "ERROR: not a semver version: $NEXT" >&2
            exit 1
          }
          test "$NEXT" != "$CURRENT" || {
            echo "ERROR: $NEXT is already the current version" >&2
            exit 1
          }
          if git rev-parse -q --verify "refs/tags/mkv-cleaner--v$NEXT" > /dev/null; then
            echo "ERROR: tag mkv-cleaner--v$NEXT already exists" >&2
            exit 1
          fi

          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=mkv-cleaner--v$NEXT" >> "$GITHUB_OUTPUT"
          echo "Releasing $CURRENT -> $NEXT"

      - name: Write the new version into every manifest
        env:
          CURRENT: ${{ steps.version.outputs.current }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -eu
          for f in .claude-plugin/plugin.json .codex-plugin/plugin.json .github/plugin/plugin.json; do
            perl -pi -e 's/"version": "\Q$ENV{CURRENT}\E"/"version": "$ENV{NEXT}"/' "$f"
            jq -e --arg v "$NEXT" '.version == $v' "$f" > /dev/null || {
              echo "ERROR: $f did not end up at $NEXT" >&2
              exit 1
            }
          done
          git diff --stat

      - name: Commit, tag and push
        if: ${{ !inputs.dry_run }}
        env:
          NEXT: ${{ steps.version.outputs.next }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release $NEXT"
          git tag -a "$TAG" -m "mkv-cleaner $NEXT"
          git push origin master
          git push origin "$TAG"

      - name: Create the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "mkv-cleaner $NEXT" \
            --generate-notes \
            --latest

      - name: Summary
        env:
          CURRENT: ${{ steps.version.outputs.current }}
          NEXT: ${{ steps.version.outputs.next }}
          TAG: ${{ steps.version.outputs.tag }}
          DRY: ${{ inputs.dry_run }}
        run: |
          {
            echo "## mkv-cleaner release"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| From | \`$CURRENT\` |"
            echo "| To | \`$NEXT\` |"
            echo "| Tag | \`$TAG\` |"
            echo "| Dry run | \`$DRY\` |"
            echo ""
            echo "Users pick this up with \`/plugin marketplace update mkv-cleaner\` then \`/plugin update mkv-cleaner@mkv-cleaner\`."
          } >> "$GITHUB_STEP_SUMMARY"
